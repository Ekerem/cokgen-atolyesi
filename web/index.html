<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Çokgen Atölyesi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: kareli defter yaprağı solda büyük; sağda bilgi paneli; doğru parçası sayacı yaprağın sol alt köşesinde */
:root{
  --bg:#E8EDF4; --paper:#FFFFFF; --grid:#D2DDEB; --ink:#1B2740; --muted:#5A6A85; --line:#CBD5E3;
  --accent:#2F5BEA; --accent-soft:#E6EDFE; --on-accent:#FFFFFF; --fill:#2F5BEA;
  --arc:#F2B200; --arc-ink:#7E5B00; --ext:#0CA678; --ext-ink:#087F5B; --warn:#C8410B; --warn-soft:#FDEBE2;
  --c1:#E8590C; --c2:#2B9348; --c3:#C2255C; --c4:#7048E8; --c5:#0C8599; --c6:#A06A00;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1522; --paper:#152033; --grid:#23324B; --ink:#E7EDF7; --muted:#97A6BF; --line:#2A3A55;
  --accent:#6F95FF; --accent-soft:#1E2C4A; --on-accent:#0E1522; --fill:#6F95FF;
  --arc:#FFD43B; --arc-ink:#F3CF6A; --ext:#38D9A9; --ext-ink:#63E6BE; --warn:#FF8A5B; --warn-soft:#3A2219;
  --c1:#FF922B; --c2:#51CF66; --c3:#F06595; --c4:#9775FA; --c5:#22B8CF; --c6:#E9B949; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1522; --paper:#152033; --grid:#23324B; --ink:#E7EDF7; --muted:#97A6BF; --line:#2A3A55;
  --accent:#6F95FF; --accent-soft:#1E2C4A; --on-accent:#0E1522; --fill:#6F95FF;
  --arc:#FFD43B; --arc-ink:#F3CF6A; --ext:#38D9A9; --ext-ink:#63E6BE; --warn:#FF8A5B; --warn-soft:#3A2219;
  --c1:#FF922B; --c2:#51CF66; --c3:#F06595; --c4:#9775FA; --c5:#22B8CF; --c6:#E9B949; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,340px);gap:16px;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}

.sheet{position:relative;min-height:0;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.board-wrap{position:absolute;inset:0}
#board{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.tip{position:absolute;top:14px;left:16px;font-weight:700;font-size:13px;color:var(--muted);background:var(--paper);padding:4px 10px;border-radius:99px;border:1px solid var(--line);pointer-events:none}

/* svg */
.gl{fill:none;stroke:var(--grid);stroke-width:.035}
.pfill{fill:var(--fill);fill-opacity:.09}
.pfill.bad{fill:var(--warn);fill-opacity:.08}
.edge{fill:none;stroke-linecap:round}
.glow{fill:none;stroke-linecap:round}
.tick{stroke-linecap:round;stroke-width:.07}
.chev{fill:none;stroke:var(--muted);stroke-width:.06;stroke-linecap:round;stroke-linejoin:round}
.arc{fill:var(--arc);fill-opacity:.26;stroke:var(--arc);stroke-width:.05}
.ra{fill:var(--arc);fill-opacity:.26;stroke:var(--arc-ink);stroke-width:.05}
.ext-line{fill:none;stroke:var(--ext);stroke-width:.06;stroke-dasharray:.2 .14;stroke-linecap:round}
.earc{fill:var(--ext);fill-opacity:.22;stroke:var(--ext);stroke-width:.05}
.et{font:700 .4px var(--body);fill:var(--ext-ink);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--paper);stroke-width:.12px;stroke-linejoin:round}
.at{font:700 .4px var(--body);fill:var(--arc-ink);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--paper);stroke-width:.12px;stroke-linejoin:round}
.vl{font:800 .56px var(--display);fill:var(--ink);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--paper);stroke-width:.14px;stroke-linejoin:round}
.dot{fill:var(--paper);stroke:var(--ink);stroke-width:.08}
.v.on .dot{fill:var(--accent);stroke:var(--accent)}
.hit{fill:transparent}
.leader{stroke:var(--muted);stroke-width:.035;stroke-dasharray:.09 .09;fill:none}
.lbox{fill:var(--accent-soft);stroke:var(--accent);stroke-width:.035}
.at.lon,.dlt.lon,.vl.lon,.et.lon{fill:var(--accent)}
.gap{stroke:var(--warn);stroke-width:.07;stroke-dasharray:.25 .2;fill:none}
.gapt{font:800 .45px var(--body);fill:var(--warn);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--paper);stroke-width:.14px}

.diag{fill:none;stroke:var(--accent);stroke-width:.075;stroke-dasharray:.32 .18;stroke-linecap:round}
.diag.faint{stroke-opacity:.55;stroke-width:.05}
.dtick{stroke:var(--accent);stroke-width:.075;stroke-linecap:round}
.dra{fill:var(--accent);fill-opacity:.15;stroke:var(--accent);stroke-width:.06}
.dpt{fill:var(--accent)}
.dlt{font:800 .36px var(--body);fill:var(--accent);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--paper);stroke-width:.14px;stroke-linejoin:round}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.dfacts{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.dfacts li{display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.dfacts .yes::before{content:"✓";color:var(--c2);font-weight:800}
.dfacts .no::before{content:"✗";color:var(--muted);font-weight:800}
.dfacts .no{color:var(--muted)}
/* controls */
.controls{position:absolute;left:16px;bottom:16px;display:flex;flex-direction:column;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 6px 20px rgb(20 30 60 / .08);max-width:calc(100% - 32px)}
.c-label{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:52px;height:52px;border-radius:14px;border:0;background:var(--accent);color:var(--on-accent);font:800 30px/1 var(--display);cursor:pointer;display:grid;place-items:center;padding-top:4px}
.stepper button:disabled{opacity:.3;cursor:not-allowed}
.stepper button:not(:disabled):active{transform:translateY(1px)}
#count{min-width:48px;text-align:center;font:800 40px/1 var(--display);font-variant-numeric:tabular-nums;padding-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--accent-soft);color:var(--ink);font:700 13px var(--body);padding:7px 12px;border-radius:99px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.tog{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.tog input{accent-color:var(--accent);width:16px;height:16px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* panel */
.panel{min-height:0;min-width:0;overflow:auto;display:flex;flex-direction:column;gap:18px;padding:4px 2px 8px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
#name{font:800 clamp(2rem,3.2vw,2.8rem)/1.05 var(--display);margin:2px 0 0;text-wrap:balance}
#name.bad{color:var(--warn)}
#name.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 8px 8px;text-align:center}
.num{display:block;font:800 34px/1 var(--display);font-variant-numeric:tabular-nums;padding-top:4px}
.lab{font-size:13px;font-weight:700;color:var(--muted)}
.sum{font-size:14px;color:var(--muted)}
.sum b{color:var(--ink);font-size:16px}
.panel h2{font:700 13px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.panel ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;line-height:1.4}
.eqs{display:flex;flex-wrap:wrap;gap:6px}
.eq{font:800 15px var(--body);padding:5px 11px;border-radius:99px;color:#fff}
.empty{font-size:14px;color:var(--muted);line-height:1.45;margin:0}
.hint{background:var(--accent-soft);border-radius:14px;padding:12px 14px;line-height:1.45;font-size:14.5px}
.hint b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.hint.bad{background:var(--warn-soft)}
.hint.bad b{color:var(--warn)}
.tables{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tbl{display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums;font-size:14px}
.tr{display:flex;align-items:center;gap:7px}
.sw{width:14px;height:5px;border-radius:3px;flex:none}
.tr .k{font-weight:800;min-width:26px}
.tr .val{margin-left:auto;color:var(--muted);font-weight:600}

@media (max-width:760px){
  html,body{height:auto}
  body{grid-template-columns:1fr}
  .board-wrap{position:relative;height:62svh;min-height:360px}
  .controls{position:static;margin:0 12px 12px;box-shadow:none;max-width:none}
}
@media (prefers-reduced-motion:reduce){#name.pop{animation:none}}

/* güncelleme ve imza */
.update{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px;margin-top:auto}
.update .chip{text-decoration:none;align-self:flex-start}
#upMsg{font-size:13px}
#upMsg.new{color:var(--c2);font-weight:800}
.credit{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));font:800 12px var(--body);letter-spacing:.05em;color:var(--muted);background:var(--bg);padding:3px 10px;border-radius:99px;pointer-events:none;z-index:5}
.panel{padding-bottom:40px}
</style>
</head>
<body>
<main class="sheet">
  <div class="board-wrap" id="wrap">
    <svg id="board" role="img" aria-label="Çokgen çizim alanı">
      <defs><pattern id="gp" width="1" height="1" patternUnits="userSpaceOnUse"><path class="gl" d="M1 0H0V1"/></pattern></defs>
      <rect id="gridRect" fill="url(#gp)"/>
      <g id="layer"></g>
    </svg>
    <div class="tip">Köşeleri ve yazıları tutup sürükle</div>
  </div>
  <div class="controls">
    <div class="c-label">Doğru parçası sayısı</div>
    <div class="stepper">
      <button id="minus" aria-label="Bir doğru parçası çıkar">−</button>
      <output id="count" aria-live="polite">4</output>
      <button id="plus" aria-label="Bir doğru parçası ekle">+</button>
    </div>
    <div class="row">
      <button class="chip" id="regular">Düzgün yap</button>
      <button class="chip" id="shuffle">Karıştır</button>
      <button class="chip" id="diagBtn" aria-pressed="false">Köşegenleri göster</button>
      <button class="chip" id="extBtn" aria-pressed="false">Dış açıları göster</button>
      <button class="chip" id="resetLbl">Yazıları yerine koy</button>
    </div>
    <div class="row">
      <label class="tog"><input type="checkbox" id="snap" checked> Kareli zemine yapış</label>
      <label class="tog"><input type="checkbox" id="par" checked> Paralel işareti</label>
    </div>
  </div>
</main>

<aside class="panel">
  <div>
    <div class="eyebrow" id="family"></div>
    <h1 id="name"></h1>
  </div>
  <div class="stats">
    <div class="stat"><span class="num" id="sE">4</span><span class="lab">kenar</span></div>
    <div class="stat"><span class="num" id="sV">4</span><span class="lab">köşe</span></div>
    <div class="stat"><span class="num" id="sA">4</span><span class="lab">iç açı</span></div>
  </div>
  <div class="sum" id="sum"></div>
  <section><h2>Özellikleri</h2><ul id="props"></ul></section>
  <section id="eqSec"><h2>Eşit kenarlar</h2><div id="eqs"></div></section>
  <section id="extSec" hidden><h2>Dış açılar</h2><div id="ext"></div></section>
  <section id="diagSec" hidden><h2>Köşegenler</h2><div id="diag"></div></section>
  <div class="hint" id="hint"></div>
  <div class="tables">
    <section><h2>Kenarlar</h2><div class="tbl" id="lens"></div></section>
    <section id="angSec"><h2>İç açılar</h2><div class="tbl" id="angs"></div></section>
  </div>
  <div class="update">
    <div class="row">
      <button class="chip" id="upBtn">Güncellemeleri denetle</button>
      <button class="chip" id="upApply" hidden>Şimdi güncelle</button>
    </div>
    <a class="chip" id="apkLink" hidden href="#" target="_blank" rel="noopener">Yeni APK’yı indir</a>
    <p class="empty" id="upMsg"></p>
  </div>
</aside>
<div class="credit">made by us</div>

<script>
const svg=document.getElementById('board'),layer=document.getElementById('layer'),gridRect=document.getElementById('gridRect'),wrap=document.getElementById('wrap');
const $=id=>document.getElementById(id);
const LET='ABCDEFGHIJKL';
const NAMES={3:'Üçgen',4:'Dörtgen',5:'Beşgen',6:'Altıgen',7:'Yedigen',8:'Sekizgen',9:'Dokuzgen',10:'Ongen',11:'On birgen',12:'On ikigen'};
const COLORS=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU=Math.PI*2,mod=(a,m)=>((a%m)+m)%m;
const fmt=x=>x.toLocaleString('tr-TR',{minimumFractionDigits:1,maximumFractionDigits:1});
const f=x=>+x.toFixed(4);

const state={n:4,pts:[{x:-4,y:2},{x:4,y:2},{x:2,y:-2},{x:-3,y:-2}],snap:true,par:true,diag:false,ext:false,drag:-1,hover:-1,dragLabel:null,hoverLabel:null,lstart:null,off:{x:0,y:0}};
const view={W:16,H:11};
let prevSig=[],flashAt=[],firstRender=true,pending=false,lastName='';

/* ---------- geometry ---------- */
function orient(a,b,c){return (b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x)}
function onSeg(a,b,c){return Math.min(a.x,b.x)-1e-9<=c.x&&c.x<=Math.max(a.x,b.x)+1e-9&&Math.min(a.y,b.y)-1e-9<=c.y&&c.y<=Math.max(a.y,b.y)+1e-9}
function inter(p1,p2,p3,p4){
  const e=1e-9,d1=orient(p3,p4,p1),d2=orient(p3,p4,p2),d3=orient(p1,p2,p3),d4=orient(p1,p2,p4);
  if(((d1>e&&d2<-e)||(d1<-e&&d2>e))&&((d3>e&&d4<-e)||(d3<-e&&d4>e)))return true;
  if(Math.abs(d1)<=e&&onSeg(p3,p4,p1))return true;
  if(Math.abs(d2)<=e&&onSeg(p3,p4,p2))return true;
  if(Math.abs(d3)<=e&&onSeg(p1,p2,p3))return true;
  if(Math.abs(d4)<=e&&onSeg(p1,p2,p4))return true;
  return false;
}
function groupsFrom(m,same){
  const p=[...Array(m).keys()],find=i=>p[i]===i?i:(p[i]=find(p[i]));
  for(let i=0;i<m;i++)for(let j=i+1;j<m;j++)if(same(i,j))p[find(i)]=find(j);
  const map=new Map();for(let i=0;i<m;i++){const r=find(i);if(!map.has(r))map.set(r,[]);map.get(r).push(i)}
  const list=[...map.values()].filter(g=>g.length>1).sort((a,b)=>a[0]-b[0]);
  const gid=Array(m).fill(-1);list.forEach((g,k)=>g.forEach(i=>gid[i]=k));
  return {list,gid};
}
function analyze(P){
  const m=P.length,L=[],dirs=[];
  for(let i=0;i<m;i++){const a=P[i],b=P[(i+1)%m];L.push(Math.hypot(b.x-a.x,b.y-a.y));dirs.push(Math.atan2(b.y-a.y,b.x-a.x))}
  let area=0;for(let i=0;i<m;i++){const a=P[i],b=P[(i+1)%m];area+=a.x*b.y-b.x*a.y}area/=2;
  const s=area>=0?1:-1,ang=[];
  for(let i=0;i<m;i++){
    const p=P[i],pr=P[(i-1+m)%m],nx=P[(i+1)%m];
    const aA=Math.atan2(pr.y-p.y,pr.x-p.x),aB=Math.atan2(nx.y-p.y,nx.x-p.x);
    let th,start;if(s>0){th=mod(aA-aB,TAU);start=aB}else{th=mod(aB-aA,TAU);start=aA}
    ang.push({th,deg:th*180/Math.PI,start});
  }
  let selfX=L.some(l=>l<1e-6)||Math.abs(area)<1e-6;
  for(let i=0;i<m&&!selfX;i++)for(let j=i+2;j<m;j++){if(i===0&&j===m-1)continue;if(inter(P[i],P[(i+1)%m],P[j],P[(j+1)%m])){selfX=true;break}}
  const maxL=Math.max(...L),tol=Math.max(.05,.02*maxL);
  const eqG=groupsFrom(m,(i,j)=>Math.abs(L[i]-L[j])<=tol);
  const parG=groupsFrom(m,(i,j)=>{if(m<4)return false;if(j===i+1||(i===0&&j===m-1))return false;let d=mod(dirs[i]-dirs[j],Math.PI);d=Math.min(d,Math.PI-d);return d<1.2*Math.PI/180});
  const convex=!selfX&&ang.every(a=>a.deg<179.5);
  const straight=!selfX&&ang.some(a=>Math.abs(a.deg-180)<.5);
  return {m,L,dirs,area,ang,selfX,gid:eqG.gid,eqGroups:eqG.list,pgid:parG.gid,parGroups:parG.list,convex,straight};
}

/* ---------- shapes ---------- */
function regularShape(n){
  const R=Math.max(2.6,Math.min(view.W,view.H)*.34),st=Math.PI/2+Math.PI/n,pts=[];
  for(let i=0;i<n;i++){const a=st+i*TAU/n;pts.push({x:R*Math.cos(a),y:R*Math.sin(a)})}
  return pts;
}
function randomShape(n){
  const R=Math.max(2.6,Math.min(view.W,view.H)*.35);
  for(let t=0;t<80;t++){
    const base=Math.random()*TAU,pts=[];
    for(let i=0;i<n;i++){const a=base+i*TAU/n+(Math.random()-.5)*(TAU/n)*.55,r=R*(.72+Math.random()*.28);pts.push({x:Math.round(r*Math.cos(a)),y:Math.round(r*Math.sin(a))})}
    const I=analyze(pts);
    if(I.convex&&Math.min(...I.L)>=1&&I.ang.every(a=>a.deg>22&&a.deg<172))return pts;
  }
  return regularShape(n);
}
const twoShape=()=>[{x:-4,y:2},{x:0,y:-3},{x:4,y:2}];

/* ---------- classify ---------- */
function classify(I){
  const n=I.m,base=NAMES[n];let fam=`${n} kenarlı çokgen`;
  if(n>=4)fam=`${base} · ${fam}`;
  if(I.selfX)return {family:fam,name:'Çokgen değil',bad:true,props:['Kenarlar birbirini kesiyor.','Çokgende kenarlar yalnızca köşelerde buluşur.'],hint:'Bir köşeyi çekerek kesişen kenarları birbirinden ayır.'};
  const deg=I.ang.map(a=>a.deg),r=deg.map(Math.round),right=r.filter(x=>x===90).length;
  const G=I.gid,eq=(i,j)=>G[i]>=0&&G[i]===G[j];
  const allEq=G.every(g=>g>=0&&g===G[0]),allAng=Math.max(...deg)-Math.min(...deg)<1;
  const props=[];let name=base,hint='';
  if(n===3){
    const k=eq(0,1)||eq(1,2)||eq(0,2);
    const obtuse=r.some(x=>x>90);
    name=(allEq?'Eşkenar':k?'İkizkenar':'Çeşitkenar')+' üçgen';
    props.push(allEq?'3 kenarı da eşit':k?'2 kenarı eşit':'Kenarlarının hepsi farklı uzunlukta');
    props.push(right?'Dik açılı: bir açısı 90°':obtuse?'Geniş açılı: bir açısı 90 dereceden büyük':'Dar açılı: tüm açıları 90 dereceden küçük');
    hint=allEq?'Tüm kenarlar eşit, her açı 60°. Bir köşeyi çekip ikizkenar üçgene dönüştür.':k?'Üç kenarı da eşitlemeyi dene: eşkenar üçgen olur. "Kareli zemine yapış" kapalıyken daha kolay.':'İki kenarı eşit yap: ikizkenar üçgen olur. Bir açıyı 90° yaparsan dik üçgen olur.';
  }else if(n===4){
    if(!I.convex){name='İçbükey dörtgen';props.push('Bir köşesi içe doğru göçük; o iç açı 180 dereceden büyük');hint='Göçük köşeyi dışarı doğru çek.'}
    else{
      const P=I.pgid,p02=P[0]>=0&&P[0]===P[2],p13=P[1]>=0&&P[1]===P[3],opp=eq(0,2)&&eq(1,3);
      if(allEq&&right===4){name='Kare';hint='Harika! Kare aynı zamanda bir dikdörtgen, bir eşkenar dörtgen ve bir paralelkenardır.'}
      else if(p02&&p13&&right===4){name='Dikdörtgen';hint='Kısa kenarları uzun kenarlar kadar uzat: kare olur.'}
      else if(allEq){name='Eşkenar dörtgen';hint='Açılarından birini 90° yap: kare olur.'}
      else if(p02&&p13){name='Paralelkenar';hint='Bir açıyı 90° yap: dikdörtgen olur. Dört kenarı eşitlersen eşkenar dörtgen olur.'}
      else if(p02||p13){const lg=p02?[1,3]:[0,2];name=right?'Dik yamuk':eq(lg[0],lg[1])?'İkizkenar yamuk':'Yamuk';hint='Kısa paralel kenarı, uzun olanla aynı boya getir: paralelkenar olur.'}
      else if((eq(0,1)&&eq(2,3))||(eq(1,2)&&eq(3,0))){name='Deltoid';hint='Komşu kenarlar ikişer ikişer eşit. Dört kenarı da eşitlersen eşkenar dörtgen olur.'}
      else{hint='Karşılıklı iki kenarı paralel yap: yamuk olur.'}
      if(p02&&p13)props.push('Karşılıklı kenarları paralel (2 çift)');else if(p02||p13)props.push('Bir çift karşılıklı kenarı paralel');
      if(allEq)props.push('4 kenarı da eşit');else if(opp)props.push('Karşılıklı kenarları eşit');
      if(right===4)props.push('4 açısı da dik açı (90°)');else if(right)props.push(`${right} dik açısı var`);
      if(!props.length)props.push('Paralel ya da eşit kenarı yok');
    }
  }else{
    if(allEq&&allAng&&I.convex){name='Düzgün '+base.toLocaleLowerCase('tr');props.push('Tüm kenarları eşit','Tüm açıları eşit');hint='Bir köşeyi biraz çek: düzgünlük bozulur, renkler değişir.'}
    else{
      if(!I.convex)props.push('İçe göçük bir köşesi var (içbükey)');
      if(allEq)props.push('Tüm kenarları eşit');
      if(allAng)props.push('Tüm açıları eşit');
      if(right)props.push(`${right} dik açısı var`);
      if(!props.length)props.push('Kenar uzunlukları ve açıları farklı');
      hint='"Düzgün yap" düğmesine bas: tüm kenarlar ve açılar eşit olur.';
    }
  }
  if(I.straight)props.push('Bir köşedeki açı 180°: o köşe düz bir çizgi gibi görünür');
  return {family:fam,name,props,hint};
}

/* ---------- köşegenler ---------- */
function diagInfo(P,I){
  const m=P.length;if(m<4||I.selfX)return null;
  const list=[];
  for(let i=0;i<m;i++)for(let j=i+2;j<m;j++){if(i===0&&j===m-1)continue;list.push({i,j,L:Math.hypot(P[j].x-P[i].x,P[j].y-P[i].y)})}
  const D={m,list,count:list.length};
  if(m===4){
    const a=P[0],c=P[2],b=P[1],d=P[3],r={x:c.x-a.x,y:c.y-a.y},s={x:d.x-b.x,y:d.y-b.y};
    const den=r.x*s.y-r.y*s.x,qp={x:b.x-a.x,y:b.y-a.y};
    D.r=r;D.s=s;
    if(Math.abs(den)>1e-9){
      const t=(qp.x*s.y-qp.y*s.x)/den,u=(qp.x*r.y-qp.y*r.x)/den;
      if(t>1e-6&&t<1-1e-6&&u>1e-6&&u<1-1e-6){
        D.X={x:a.x+t*r.x,y:a.y+t*r.y};D.t=t;D.u=u;
        D.bisAC=Math.abs(t-.5)<.012;D.bisBD=Math.abs(u-.5)<.012;
        let ang=Math.abs(Math.atan2(den,r.x*s.x+r.y*s.y))*180/Math.PI;if(ang>90)ang=180-ang;
        D.angle=ang;D.perp=Math.round(ang)===90;
      }
    }
    const L1=list[0].L,L2=list[1].L;D.equal=Math.abs(L1-L2)<=Math.max(.05,.02*Math.max(L1,L2));
  }
  return D;
}
function diagSvg(P,D){
  let back='',front='';
  D.list.forEach(d=>{const a=P[d.i],b=P[d.j];back+=`<line class="diag${D.m>4?' faint':''}" x1="${f(a.x)}" y1="${f(a.y)}" x2="${f(b.x)}" y2="${f(b.y)}"/>`});
  if(D.m!==4)return {back,front};
  // uzunluk etiketleri
  D.list.forEach((d,k)=>{
    const a=P[d.i],b=P[d.j],u={x:(b.x-a.x)/d.L,y:(b.y-a.y)/d.L},nr={x:-u.y,y:u.x},t=k===0?.27:.73;
    const c={x:a.x+(b.x-a.x)*t+nr.x*.32,y:a.y+(b.y-a.y)*t+nr.y*.32};
    front+=lbl('d'+k,'dlt',c.x,c.y,`${LET[d.i]+LET[d.j]} = ${fmt(d.L)}`,{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});
  });
  if(D.X){
    const X=D.X;
    // ortadan bölme çentikleri: AC yarıları 1 çizgi, BD yarıları 2 çizgi
    const marks=(a,b,L,k)=>{const u={x:(b.x-a.x)/L,y:(b.y-a.y)/L},nr={x:-u.y,y:u.x};let s='';
      [a,b].forEach(e=>{const mid={x:(e.x+X.x)/2,y:(e.y+X.y)/2};for(let j=0;j<k;j++){const o=(j-(k-1)/2)*.14,c={x:mid.x+u.x*o,y:mid.y+u.y*o};
        s+=`<line class="dtick" x1="${f(c.x-nr.x*.17)}" y1="${f(c.y-nr.y*.17)}" x2="${f(c.x+nr.x*.17)}" y2="${f(c.y+nr.y*.17)}"/>`}});return s};
    if(D.bisAC)front+=marks(P[0],P[2],D.list[0].L,1);
    if(D.bisBD)front+=marks(P[1],P[3],D.list[1].L,2);
    if(D.perp){
      const rl=Math.hypot(D.r.x,D.r.y),sl=Math.hypot(D.s.x,D.s.y),z=.34,u={x:D.r.x/rl*z,y:D.r.y/rl*z},v={x:D.s.x/sl*z,y:D.s.y/sl*z};
      front+=`<path class="dra" d="M${f(X.x)} ${f(X.y)}L${f(X.x+u.x)} ${f(X.y+u.y)}L${f(X.x+u.x+v.x)} ${f(X.y+u.y+v.y)}L${f(X.x+v.x)} ${f(X.y+v.y)}Z"/>`;
    }
    front+=`<circle class="dpt" cx="${f(X.x)}" cy="${f(X.y)}" r=".11"/>`;
  }
  return {back,front};
}
function diagPanel(D,m,selfX){

  const el=$('diag');
  if(m===2){sec.hidden=true;return}
  if(m===3){el.innerHTML='<p class="empty">Üçgenin köşegeni yoktur. Her köşe diğer iki köşeye zaten bir kenarla bağlı.</p>';return}

  let h=`<p class="empty"><b style="color:var(--ink)">${D.count} köşegen</b> · her köşeden ${m-3} köşegen çıkar</p>`;
  if(m<=6)h+=`<div class="tbl" style="margin-top:8px">${D.list.map(d=>`<div class="tr"><span class="sw" style="background:var(--accent)"></span><span class="k">${LET[d.i]+LET[d.j]}</span><span class="val">${fmt(d.L)} birim</span></div>`).join('')}</div>`;
  if(m===4){
    const li=(ok,yes,no)=>`<li class="${ok?'yes':'no'}">${ok?yes:no}</li>`;
    if(!D.X)h+=`<ul class="dfacts">${li(false,'','Köşegenler şeklin içinde kesişmiyor (içbükey dörtgen)')}</ul>`;
    else h+=`<ul class="dfacts">

      ${li(D.perp,'Köşegenler dik kesişir (90°)',`Köşegenler dik kesişmiyor (aralarındaki açı ${Math.round(D.angle)}°)`)}

}

function extPanel(I){
  const sec=$('extSec');sec.hidden=!state.ext;if(!state.ext)return;
  const el=$('ext');

  h+=`<div class="tbl" style="margin-top:8px">${I.ang.map((a,i)=>{const ia=Math.round(a.deg);return a.deg>=179.5?`<div class="tr"><span class="k">${LET[i]}</span><span class="val">${ia>180?'içe göçük köşe':'düz açı'}</span></div>`:`<div class="tr"><span class="sw" style="background:var(--ext)"></span><span class="k">${LET[i]}</span><span class="val">${ia}° + <b style="color:var(--ext-ink)">${180-ia}°</b> = 180°</span></div>`}).join('')}</div>`;
  h+=I.convex?`<p class="empty" style="margin-top:8px">Dış açıların toplamı <b style="color:var(--ink)">360°</b>. Şekil nasıl değişirse değişsin bu toplam değişmez.</p>`:`<p class="empty" style="margin-top:8px">İçe göçük köşelerde dış açı çizilmez.</p>`;

/* ---------- render ---------- */
function requestRender(){if(!pending){pending=true;requestAnimationFrame(render)}}
const P2=(p,a,r)=>({x:p.x+r*Math.cos(a),y:p.y+r*Math.sin(a)});

/* sürüklenebilir yazılar: her yazının kendi otomatik yerine göre kaydırması saklanır */
let labelOff={},labelHits=[];
const FS={at:.4,dlt:.36,vl:.56,et:.4};
function lbl(key,cls,x,y,text,anchor){
  const o=labelOff[key]||{x:0,y:0},X=x+o.x,Y=y+o.y,fs=FS[cls];
  const w=String(text).length*fs*.6+.24,hh=fs+.22;
  labelHits.push({key,x:X,y:Y,w,h:hh});
  const on=state.dragLabel===key||state.hoverLabel===key;
  let s='';
  if(anchor&&Math.hypot(o.x,o.y)>.45)s+=`<line class="leader" x1="${f(anchor.x)}" y1="${f(anchor.y)}" x2="${f(X)}" y2="${f(Y)}"/>`;
  if(on)s+=`<rect class="lbox" x="${f(X-w/2)}" y="${f(Y-hh/2)}" width="${f(w)}" height="${f(hh)}" rx=".14"/>`;
  return s+`<text class="${cls}${on?' lon':''}" x="${f(X)}" y="${f(Y)}">${text}</text>`;
}
function vertexMarkup(p,i,labelPos){
  const on=state.drag===i||state.hover===i,cls='v'+(on?' on':'')+(state.drag===i?' drag':'');
  return `<g class="${cls}"><circle class="hit" cx="${f(p.x)}" cy="${f(p.y)}" r=".75"/><circle class="dot" cx="${f(p.x)}" cy="${f(p.y)}" r="${on?.32:.24}"/></g>`+lbl('v'+i,'vl',labelPos.x,labelPos.y,LET[i],p);
}

function render(){
  pending=false;
  const now=performance.now(),P=state.pts,n=state.n;let h='',animating=false;labelHits=[];
  if(n===2){
    const [a,b,c]=P,cx=(a.x+b.x+c.x)/3,cy=(a.y+b.y+c.y)/3;
    h+=`<line class="gap" x1="${f(c.x)}" y1="${f(c.y)}" x2="${f(a.x)}" y2="${f(a.y)}"/>`;
    const mx=(a.x+c.x)/2,my=(a.y+c.y)/2,dx=mx-cx,dy=my-cy,dl=Math.hypot(dx,dy)||1;
    h+=`<text class="gapt" x="${f(mx+dx/dl*.6)}" y="${f(my+dy/dl*.6)}">Açık kaldı!</text>`;
    h+=`<polyline class="edge" style="stroke:var(--ink);stroke-width:.13" points="${P.map(p=>f(p.x)+','+f(p.y)).join(' ')}"/>`;
    P.forEach((p,i)=>{const dx=p.x-cx,dy=p.y-cy,l=Math.hypot(dx,dy)||1;h+=vertexMarkup(p,i,{x:p.x+dx/l*.65,y:p.y+dy/l*.65})});
    layer.innerHTML=h;
    panelTwo(P);
    diagPanel(null,2,false);
    $('extSec').hidden=true;
    return;
  }
  const I=analyze(P),m=I.m;
  const sigs=I.gid.map(g=>g<0?'':I.eqGroups[g].join(','));
  if(!firstRender)sigs.forEach((s,i)=>{if(s&&s!==prevSig[i])flashAt[i]=now});
  prevSig=sigs;firstRender=false;

  h+=`<polygon class="pfill${I.selfX?' bad':''}" points="${P.map(p=>f(p.x)+','+f(p.y)).join(' ')}"/>`;
  const D=diagInfo(P,I),DS=state.diag&&D?diagSvg(P,D):{back:'',front:''};
  h+=DS.back;
  // açı yayları
  const arcText=[];
  if(!I.selfX)I.ang.forEach((A,i)=>{
    const p=P[i],lp=I.L[(i-1+m)%m],ln=I.L[i],r=Math.min(.78,.32*Math.min(lp,ln)),deg=Math.round(A.deg);
    if(deg===90){
      const s=Math.min(.5,r*.75),u=P2({x:0,y:0},A.start,s),v=P2({x:0,y:0},A.start+A.th,s);
      h+=`<path class="ra" d="M${f(p.x)} ${f(p.y)}L${f(p.x+u.x)} ${f(p.y+u.y)}L${f(p.x+u.x+v.x)} ${f(p.y+u.y+v.y)}L${f(p.x+v.x)} ${f(p.y+v.y)}Z"/>`;
    }else if(A.th>.005){
      const s0=P2(p,A.start,r),s1=P2(p,A.start+A.th,r);
      h+=`<path class="arc" d="M${f(p.x)} ${f(p.y)}L${f(s0.x)} ${f(s0.y)}A${f(r)} ${f(r)} 0 ${A.th>Math.PI?1:0} 1 ${f(s1.x)} ${f(s1.y)}Z"/>`;
    }
    const extra=A.deg<40?(40-A.deg)/40*.7:0,tp=P2(p,A.start+A.th/2,r+.42+extra);
    arcText.push(lbl('a'+i,'at',tp.x,tp.y,deg+'°',p));
  });
  // dış açılar: önceki kenarı köşeden öteye uzat, uzantı ile sonraki kenar arasındaki açı
  const extText=[];
  if(state.ext&&!I.selfX)I.ang.forEach((A,i)=>{
    if(A.deg>=179.5)return;
    const p=P[i],pr=P[(i-1+m)%m],nx=P[(i+1)%m],lp=I.L[(i-1+m)%m];
    const aE=Math.atan2(p.y-pr.y,p.x-pr.x),aB=Math.atan2(nx.y-p.y,nx.x-p.x);
    const ext=Math.min(1.9,Math.max(1.2,lp*.45)),q=P2(p,aE,ext);
    h+=`<line class="ext-line" x1="${f(p.x)}" y1="${f(p.y)}" x2="${f(q.x)}" y2="${f(q.y)}"/>`;
    let st=aE,sw=mod(aB-aE,TAU);if(sw>Math.PI){st=aB;sw=TAU-sw}
    const r=Math.min(.62,ext*.45),s0=P2(p,st,r),s1=P2(p,st+sw,r);
    if(sw>.005)h+=`<path class="earc" d="M${f(p.x)} ${f(p.y)}L${f(s0.x)} ${f(s0.y)}A${f(r)} ${f(r)} 0 0 1 ${f(s1.x)} ${f(s1.y)}Z"/>`;
    const deg=180-Math.round(A.deg),extra=sw<.7?(.7-sw)*.8:0,tp=P2(p,st+sw/2,r+.42+extra);
    extText.push(lbl('e'+i,'et',tp.x,tp.y,deg+'°',p));
  });
  // kenarlar
  for(let i=0;i<m;i++){
    const a=P[i],b=P[(i+1)%m],g=I.gid[i],col=g>=0?COLORS[g%COLORS.length]:'var(--ink)';
    let t=1;if(flashAt[i]!=null&&!reduce){t=(now-flashAt[i])/800;if(t<1)animating=true;else t=1}
    if(t<1)h+=`<line class="glow" x1="${f(a.x)}" y1="${f(a.y)}" x2="${f(b.x)}" y2="${f(b.y)}" style="stroke:${col};stroke-width:${f(.55*(1-t)+.15)};stroke-opacity:${f(.4*(1-t))}"/>`;
    h+=`<line class="edge" x1="${f(a.x)}" y1="${f(a.y)}" x2="${f(b.x)}" y2="${f(b.y)}" style="stroke:${I.selfX?'var(--warn)':col};stroke-width:${f(g>=0?.16+.1*(1-t):.12)}"/>`;
    const L=I.L[i];if(L<1e-6)continue;
    const u={x:(b.x-a.x)/L,y:(b.y-a.y)/L},nr={x:-u.y,y:u.x},mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    if(g>=0&&!I.selfX){
      const k=Math.min(3,g+1);
      for(let j=0;j<k;j++){const o=(j-(k-1)/2)*.17,c={x:mid.x+u.x*o,y:mid.y+u.y*o};
        h+=`<line class="tick" x1="${f(c.x-nr.x*.24)}" y1="${f(c.y-nr.y*.24)}" x2="${f(c.x+nr.x*.24)}" y2="${f(c.y+nr.y*.24)}" style="stroke:${col}"/>`}
    }
    const pg=I.pgid[i];
    if(state.par&&pg>=0&&!I.selfX&&L>1.6){
      const ca=mod(Math.atan2(u.y,u.x),Math.PI),ud={x:Math.cos(ca),y:Math.sin(ca)},nd={x:-ud.y,y:ud.x},k=Math.min(3,pg+1);
      for(let j=0;j<k;j++){const c={x:mid.x+ud.x*(.6+j*.2),y:mid.y+ud.y*(.6+j*.2)};
        h+=`<path class="chev" d="M${f(c.x-ud.x*.2+nd.x*.15)} ${f(c.y-ud.y*.2+nd.y*.15)}L${f(c.x)} ${f(c.y)}L${f(c.x-ud.x*.2-nd.x*.15)} ${f(c.y-ud.y*.2-nd.y*.15)}"/>`}
    }
  }
  h+=arcText.join('');
  h+=extText.join('');
  h+=DS.front;
  // köşeler
  const cx=P.reduce((s,p)=>s+p.x,0)/m,cy=P.reduce((s,p)=>s+p.y,0)/m;
  P.forEach((p,i)=>{
    let lp;
    if(!I.selfX){const A=I.ang[i];lp=P2(p,A.start+A.th/2+Math.PI,.62)}
    else{const dx=p.x-cx,dy=p.y-cy,l=Math.hypot(dx,dy)||1;lp={x:p.x+dx/l*.62,y:p.y+dy/l*.62}}
    h+=vertexMarkup(p,i,lp);
  });
  layer.innerHTML=h;
  panel(I,classify(I));
  diagPanel(D,m,I.selfX);
  extPanel(I);
  if(animating)requestRender();
}

/* ---------- panel ---------- */
function setName(name,bad){
  const el=$('name');el.classList.toggle('bad',!!bad);
  if(name!==lastName){el.textContent=name;el.classList.remove('pop');void el.offsetWidth;if(lastName)el.classList.add('pop');lastName=name}
  svg.setAttribute('aria-label','Çizim alanı: '+name);
}
function edgeName(i,m){return LET[i]+LET[(i+1)%m]}
function panel(I,C){

  $('family').textContent=C.family;setName(C.name,C.bad);
  $('sE').textContent=m;$('sV').textContent=m;$('sA').textContent=I.selfX?'–':m;
  $('sum').innerHTML=I.selfX?'':`İç açılarının toplamı <b>${(m-2)*180}°</b>`;
  $('props').innerHTML=C.props.map(p=>`<li>${p}</li>`).join('');
  $('eqSec').hidden=false;
  $('eqs').innerHTML=I.eqGroups.length?`<div class="eqs">${I.eqGroups.map((g,k)=>`<span class="eq" style="background:${COLORS[k%COLORS.length]}">${g.map(i=>edgeName(i,m)).join(' = ')}</span>`).join('')}</div>`
    :`<p class="empty">Henüz eşit kenar yok. Bir köşeyi sürükleyip iki kenarı aynı uzunlukta yap; ikisi de aynı renge boyanacak.</p>`;
  const hint=$('hint');hint.classList.toggle('bad',!!C.bad);hint.innerHTML=`<b>Şimdi dene</b>${C.hint}`;
  const mean=I.L.map((l,i)=>{const g=I.gid[i];if(g<0)return l;const gr=I.eqGroups[g];return gr.reduce((s,j)=>s+I.L[j],0)/gr.length});
  $('lens').innerHTML=I.L.map((l,i)=>{const g=I.gid[i],col=g>=0?COLORS[g%COLORS.length]:'var(--line)';return `<div class="tr"><span class="sw" style="background:${col}"></span><span class="k">${edgeName(i,m)}</span><span class="val">${fmt(mean[i])}</span></div>`}).join('');
  $('angSec').hidden=I.selfX;
  $('angs').innerHTML=I.ang.map((a,i)=>`<div class="tr"><span class="k">${LET[i]}</span><span class="val">${Math.round(a.deg)}°</span></div>`).join('');
}
function panelTwo(P){
  $('family').textContent='2 doğru parçası';setName('Kapalı şekil yok',true);
  $('sE').textContent='–';$('sV').textContent='–';$('sA').textContent='–';$('sum').innerHTML='';
  $('props').innerHTML=['İki doğru parçası bir bölgenin etrafını kapatamaz.','Uçları birleştirmeye çalışınca iki parça üst üste biner.','Çokgen için en az 3 doğru parçası gerekir.'].map(p=>`<li>${p}</li>`).join('');
  $('eqSec').hidden=true;
  const hint=$('hint');hint.classList.add('bad');hint.innerHTML='<b>Şimdi dene</b>+ düğmesine bas ve 3. doğru parçasını ekle: ilk çokgenin, üçgen oluşur.';
  const L=[Math.hypot(P[1].x-P[0].x,P[1].y-P[0].y),Math.hypot(P[2].x-P[1].x,P[2].y-P[1].y)];
  $('lens').innerHTML=['AB','BC'].map((k,i)=>`<div class="tr"><span class="sw" style="background:var(--ink)"></span><span class="k">${k}</span><span class="val">${fmt(L[i])}</span></div>`).join('');
  $('angSec').hidden=true;
}

/* ---------- interaction ---------- */
function toWorld(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());return {x:q.x,y:q.y}}
function nearest(w,max){let best=-1,bd=max;state.pts.forEach((p,i)=>{const d=Math.hypot(p.x-w.x,p.y-w.y);if(d<bd){bd=d;best=i}});return best}
function hitLabel(w,pad){for(let k=labelHits.length-1;k>=0;k--){const L=labelHits[k];if(Math.abs(w.x-L.x)<=L.w/2+pad&&Math.abs(w.y-L.y)<=L.h/2+pad)return L.key}return null}
function setCursor(){svg.style.cursor=state.drag>=0?'grabbing':state.dragLabel?'move':state.hover>=0?'grab':state.hoverLabel?'move':''}
svg.addEventListener('pointerdown',e=>{
  const w=toWorld(e),mouse=e.pointerType==='mouse';
  let i=nearest(w,.38),key=null;
  if(i<0)key=hitLabel(w,mouse?.04:.18);
  if(i<0&&!key)i=nearest(w,mouse?.7:1);
  if(i<0&&!key)return;
  if(key){state.dragLabel=key;const o=labelOff[key]||{x:0,y:0};state.lstart={w,o:{x:o.x,y:o.y}}}
  else{state.drag=i;state.off={x:state.pts[i].x-w.x,y:state.pts[i].y-w.y}}
  try{svg.setPointerCapture(e.pointerId)}catch(_){}
  e.preventDefault();setCursor();requestRender();
});
svg.addEventListener('pointermove',e=>{
  const w=toWorld(e);
  if(state.dragLabel){
    let x=state.lstart.o.x+w.x-state.lstart.w.x,y=state.lstart.o.y+w.y-state.lstart.w.y;
    const d=Math.hypot(x,y),max=3.5;if(d>max){x*=max/d;y*=max/d}
    labelOff[state.dragLabel]={x,y};requestRender();return;
  }
  if(state.drag<0){
    let i=nearest(w,.38),key=null;if(i<0)key=hitLabel(w,.04);if(i<0&&!key)i=nearest(w,.7);
    if(i!==state.hover||key!==state.hoverLabel){state.hover=i;state.hoverLabel=key;setCursor();requestRender()}
    return;
  }
  let x=w.x+state.off.x,y=w.y+state.off.y;
  if(state.snap){x=Math.round(x);y=Math.round(y)}
  const mx=view.W/2-.6,my=view.H/2-.6;
  x=Math.max(-mx,Math.min(mx,x));y=Math.max(-my,Math.min(my,y));
  if(state.pts.some((p,j)=>j!==state.drag&&Math.hypot(p.x-x,p.y-y)<.3))return;
  const p=state.pts[state.drag];if(p.x===x&&p.y===y)return;
  state.pts[state.drag]={x,y};requestRender();
});
const end=()=>{if(state.drag>=0||state.dragLabel){state.drag=-1;state.dragLabel=null;setCursor();requestRender()}};
svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
svg.addEventListener('pointerleave',()=>{if(state.drag<0&&!state.dragLabel&&(state.hover>=0||state.hoverLabel)){state.hover=-1;state.hoverLabel=null;setCursor();requestRender()}});
$('resetLbl').onclick=()=>{labelOff={};requestRender()};

function setN(n){
  n=Math.max(2,Math.min(12,n));state.n=n;
  state.pts=n===2?twoShape():randomShape(n);
  prevSig=[];flashAt=[];firstRender=true;labelOff={};
  $('count').textContent=n;$('minus').disabled=n<=2;$('plus').disabled=n>=12;
  requestRender();
}
$('minus').onclick=()=>setN(state.n-1);
$('plus').onclick=()=>setN(state.n+1);
$('shuffle').onclick=()=>{if(state.n===2)return;state.pts=randomShape(state.n);labelOff={};prevSig=[];flashAt=[];firstRender=true;requestRender()};
$('regular').onclick=()=>{if(state.n===2)return;state.pts=regularShape(state.n);labelOff={};prevSig=[];flashAt=[];requestRender()};
$('diagBtn').onclick=e=>{state.diag=!state.diag;e.currentTarget.setAttribute('aria-pressed',state.diag);e.currentTarget.textContent=state.diag?'Köşegenleri gizle':'Köşegenleri göster';requestRender()};
$('extBtn').onclick=e=>{state.ext=!state.ext;e.currentTarget.setAttribute('aria-pressed',state.ext);e.currentTarget.textContent=state.ext?'Dış açıları gizle':'Dış açıları göster';requestRender()};
$('snap').onchange=e=>{state.snap=e.target.checked};
$('par').onchange=e=>{state.par=e.target.checked;requestRender()};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='+'||e.key==='='){setN(state.n+1)}else if(e.key==='-'){setN(state.n-1)}
});

function resize(){
  const r=wrap.getBoundingClientRect();if(!r.width||!r.height)return;
  const unit=Math.max(26,Math.min(58,Math.min(r.width,r.height)/11));
  view.W=r.width/unit;view.H=r.height/unit;
  svg.setAttribute('viewBox',`${-view.W/2} ${-view.H/2} ${view.W} ${view.H}`);
  gridRect.setAttribute('x',-view.W/2);gridRect.setAttribute('y',-view.H/2);gridRect.setAttribute('width',view.W);gridRect.setAttribute('height',view.H);
  requestRender();
}
new ResizeObserver(resize).observe(wrap);
$('minus').disabled=false;
resize();render();

/* ---------- güncelleme ---------- */
const APP_VERSION='1.4.0';
const UPDATE={owner:'Ekerem',repo:'cokgen-atolyesi'};
const PAGE_URL=`https://${UPDATE.owner.toLowerCase()}.github.io/${UPDATE.repo}/`;
const APK_URL=`https://github.com/${UPDATE.owner}/${UPDATE.repo}/releases/latest/download/cokgen-atolyesi.apk`;
const cmpV=(a,b)=>{const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d>0?1:-1}return 0};
const apkVersion=(()=>{try{return window.AndroidApp&&AndroidApp.apkVersion()}catch(_){return null}})();
function upMsg(t,isNew){const el=$('upMsg');el.textContent=t;el.classList.toggle('new',!!isNew)}
const baseMsg=()=>`Sürüm ${APP_VERSION}`+(apkVersion?` · uygulama ${apkVersion}`:'');
async function checkUpdate(silent){
  if(UPDATE.owner==='OWNER'){if(!silent)upMsg('Güncelleme adresi henüz ayarlanmadı.');return}
  if(!silent)upMsg('Denetleniyor…');
  try{
    const r=await fetch(PAGE_URL+'version.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    const newer=cmpV(j.version,APP_VERSION)>0;
    const apkOld=apkVersion&&j.apkMin&&cmpV(j.apkMin,apkVersion)>0;
    $('upApply').hidden=!newer;
    const a=$('apkLink');a.hidden=!apkOld;a.href=APK_URL;
    if(newer)upMsg(`Yeni sürüm hazır: ${j.version}${j.notes?' · '+j.notes:''}`,true);
    else if(apkOld)upMsg('Uygulamanın yeni bir APK sürümü var.',true);
    else if(!silent)upMsg(`En güncel sürümü kullanıyorsun (${APP_VERSION}).`);
  }catch(e){if(!silent)upMsg('Güncelleme denetlenemedi. İnternet bağlantını kontrol et.')}
}
$('upBtn').onclick=()=>checkUpdate(false);
$('upApply').onclick=()=>{location.href=PAGE_URL+'?v='+Date.now()};
upMsg(baseMsg());
checkUpdate(true);
</script>
